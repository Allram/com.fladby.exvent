name: Validate Homey App

# Pull requests are off in this repository; contributions come as pull
# requests on the GitHub mirror (github.com/Allram/com.fladby.exvent), where
# .github/workflows/pr.yml runs the same checks.
on:
  push:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node 22 is the floor the project is typed for (engines >=22,
  # @tsconfig/node22), so the unit tests run there too. The job image
  # provides Node 22: a second actions/setup-node step in one job makes the
  # runner fetch the action twice, and in run 55 the second fetch failed on
  # the shared action cache ("shallow file has changed since we read it").
  test-node22:
    name: Unit tests (Node 22)
    runs-on: docker
    timeout-minutes: 15
    container:
      image: data.forgejo.org/oci/node:22
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

  validate:
    runs-on: docker
    timeout-minutes: 15
    steps:
      # actions/checkout works against this instance (REQUIRE_SIGNIN_VIEW) since
      # 2026-08-09, when the Authelia bypass behind the August "could not read
      # Username" failures was fixed.
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      # Node 24 is what Homey Pro runs (v24.21.0 on firmware 13.5, checked
      # 2026-09-29) and what the Homey CLI requires (>=24). The unit tests
      # also run on Node 22 in the test-node22 job.
      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Validate Homey App (publish level)
        run: npx homey app validate --level publish

      # Validation rebuilds app.json from .homeycompose; a difference means
      # the committed app.json is out of date.
      - name: Committed app.json is up to date
        run: git diff --exit-code app.json
