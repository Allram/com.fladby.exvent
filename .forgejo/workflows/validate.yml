name: Validate Homey App

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Validate Homey App (publish level)
        run: npx homey app validate --level publish
