name: Publish Homey App

# Publishes to the Homey App Store when a version tag (v*) is pushed,
# or manually via "Run workflow" in Forgejo.
#
# Runs the same steps as Athom's official publish action
# (athombv/github-action-homey-app-publish), but as plain run-steps
# because Docker-based actions hardcode /github/workspace, which is
# incompatible with Forgejo's act_runner.
#
# Requires the repository secret HOMEY_PAT — create a Personal Access Token
# at https://tools.developer.homey.app/me and add it under
# Settings -> Actions -> Secrets in Forgejo.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: docker
    steps:
      # This instance runs with REQUIRE_SIGNIN_VIEW, and it rejects the
      # Authorization header actions/checkout installs, so git falls back to
      # prompting and dies with "could not read Username". Clone by hand with
      # the run token in the URL, the same way Allram/MagicMatch does.
      - name: Checkout
        run: |
          git init -q .
          git remote add origin \
            "https://actions:${{ github.token }}@kode.fladby.org/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Validate Homey App (publish level)
        run: npx homey app validate --level publish

      - name: Publish to Homey App Store
        env:
          HOMEY_HEADLESS: "1"
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: npx homey app publish

      - name: Release info
        run: echo "Manage the release at https://tools.developer.homey.app/apps/app/com.fladby.exvent"
