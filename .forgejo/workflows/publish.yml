name: Publish Homey App

# Publishes to the Homey App Store when a version tag (v*) is pushed,
# or manually via "Run workflow" in Forgejo.
#
# Runs the same steps as Athom's official publish action
# (athombv/github-action-homey-app-publish), but as plain run-steps
# because Docker-based actions hardcode /github/workspace, which is
# incompatible with Forgejo's act_runner.
#
# Requires the repository secret HOMEY_PAT — create a Personal Access Token
# at https://tools.developer.homey.app/me and add it under
# Settings -> Actions -> Secrets in Forgejo.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Node 22 is the floor the project is typed for (engines >=22,
  # @tsconfig/node22), so the unit tests run there too. The job image
  # provides Node 22: a second actions/setup-node step in one job makes the
  # runner fetch the action twice, and in run 55 the second fetch failed on
  # the shared action cache ("shallow file has changed since we read it").
  test-node22:
    name: Unit tests (Node 22)
    runs-on: docker
    container:
      image: data.forgejo.org/oci/node:22
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin \
            "https://actions:${{ github.token }}@kode.fladby.org/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

  publish:
    # Publish only when the unit tests also pass on Node 22.
    needs: test-node22
    runs-on: docker
    steps:
      # Clone by hand with the run token in the URL (instance runs with
      # REQUIRE_SIGNIN_VIEW). This works and is kept, but actions/checkout@v4
      # also works against this instance: the "could not read Username"
      # failures in August 2026 came from the Authelia bypass, fixed 2026-08-09.
      - name: Checkout
        run: |
          git init -q .
          git remote add origin \
            "https://actions:${{ github.token }}@kode.fladby.org/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      # Node 24 is what Homey Pro runs (v24.21.0 on firmware 13.5, checked
      # 2026-09-29) and what the Homey CLI requires (>=24). The unit tests
      # also run on Node 22 in the test-node22 job.
      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Validate Homey App (publish level)
        run: npx homey app validate --level publish

      - name: Publish to Homey App Store
        env:
          HOMEY_HEADLESS: "1"
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: npx homey app publish

      - name: Release info
        run: echo "Manage the release at https://tools.developer.homey.app/apps/app/com.fladby.exvent"
