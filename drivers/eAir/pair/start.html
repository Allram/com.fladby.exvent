<style type="text/css">
  .pairing {
    max-width: 340px;
    margin: 0 auto;
    padding: 8px 4px;
  }
  .pairing .intro {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 20px;
  }
  .pairing .field {
    margin-bottom: 16px;
  }
  .pairing label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .pairing input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fff;
    color: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .pairing input:focus {
    border-color: #0091ff;
    box-shadow: 0 0 0 3px rgba(0, 145, 255, 0.15);
  }
  .pairing .connect-button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    font-size: 16px;
    font-weight: 600;
    color: #9ca3af;
    background: #e5e7eb;
    border: none;
    border-radius: 10px;
    cursor: default;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .pairing .connect-button.ready {
    color: #fff;
    background: #0091ff;
    cursor: pointer;
  }
  .pairing .connect-button.busy {
    opacity: 0.6;
    cursor: default;
  }
  .pairing .error {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    font-size: 14px;
    border-radius: 10px;
    background: rgba(255, 99, 0, 0.12);
    color: #d33c19;
  }
  @media (prefers-color-scheme: dark) {
    .pairing .intro { color: #9ca3af; }
    .pairing input {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.16);
    }
    .pairing .connect-button {
      color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.1);
    }
    .pairing .connect-button.ready {
      color: #fff;
      background: #0091ff;
    }
    .pairing .error { color: #ff8a5c; }
  }
</style>

<div class="pairing">
  <p class="intro" data-i18n="pair.intro_eAir"></p>
  <div class="field">
    <label for="address" data-i18n="pair.address">IP address</label>
    <input type="text" id="address" placeholder="192.168.1.100" autocomplete="off" autocapitalize="off" spellcheck="false" required
      oninput="updateButtonState()" onkeydown="if (event.key === 'Enter') addDevice()">
  </div>
  <div class="field">
    <label for="port" data-i18n="pair.port">Port</label>
    <input type="number" id="port" placeholder="502" value="502" min="1" max="65535" required
      oninput="updateButtonState()" onkeydown="if (event.key === 'Enter') addDevice()">
  </div>
  <button type="button" id="connect" class="connect-button" data-i18n="pair.connect" disabled
    onclick="addDevice()">Connect</button>
  <p id="error" class="error"></p>
</div>

<!--
  All handlers are wired inline (onclick/oninput) and the functions are put
  explicitly on window: Homey injects pair views into an already-loaded page,
  so DOMContentLoaded never fires here, and depending on how the view's
  script blocks are evaluated, top-level declarations are not guaranteed to
  be reachable from other blocks. Inline attributes resolve against window
  at event time, which works in every case.
-->
<script type="text/javascript">
  Homey.setTitle(__('pair.title_eAir'));

  window.showError = function (msg) {
    var box = document.getElementById('error');
    box.textContent = msg;
    box.style.display = 'block';
  };

  window.hideError = function () {
    document.getElementById('error').style.display = 'none';
  };

  window.isValidHost = function (value) {
    var ipv4 = /^(\d{1,3}\.){3}\d{1,3}$/;
    if (ipv4.test(value)) {
      return value.split('.').every(function (octet) { return Number(octet) <= 255; });
    }
    return /^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$/.test(value);
  };

  window.updateButtonState = function () {
    var button = document.getElementById('connect');
    if (!button || button.classList.contains('busy')) return;
    var ready = document.getElementById('address').value.trim() !== ''
      && document.getElementById('port').value !== '';
    button.classList.toggle('ready', ready);
    button.disabled = !ready;
  };

  window.addDevice = function () {
    var address = document.getElementById('address').value.trim();
    var portValue = document.getElementById('port').value;
    var port = Number(portValue);
    var button = document.getElementById('connect');

    window.hideError();

    if (!address || !portValue) {
      window.showError(__('pair.nosettings'));
      return;
    }
    if (!window.isValidHost(address) || !Number.isInteger(port) || port < 1 || port > 65535) {
      window.showError(__('pair.invalidip'));
      return;
    }

    button.disabled = true;
    button.classList.add('busy');
    button.textContent = __('pair.connecting');

    var deviceId = Math.random().toString(36).substring(2, 7).toLowerCase();
    Homey.addDevice({
      name: 'eAir',
      data: { id: deviceId },
      settings: { address: address, port: port },
    }, function (error) {
      if (error) {
        button.classList.remove('busy');
        button.textContent = __('pair.connect');
        window.updateButtonState();
        window.showError(error.message || error.toString());
        return;
      }
      Homey.done();
    });
  };

  // Retry until the injected markup exists, then sync the button state
  // (the port field is prefilled) and focus the address field.
  (function initPairing() {
    if (!document.getElementById('connect')) {
      setTimeout(initPairing, 50);
      return;
    }
    window.updateButtonState();
    document.getElementById('address').focus();
  })();
</script>
