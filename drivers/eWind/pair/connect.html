<style type="text/css">
  .pairing {
    max-width: 340px;
    margin: 0 auto;
    padding: 8px 4px;
  }
  .pairing .intro {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 20px;
  }
  .pairing .field {
    margin-bottom: 16px;
  }
  .pairing label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .pairing input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fff;
    color: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .pairing input:focus {
    border-color: #0091ff;
    box-shadow: 0 0 0 3px rgba(0, 145, 255, 0.15);
  }
  .pairing .connect-button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    font-size: 16px;
    font-weight: 600;
    color: #9ca3af;
    background: #e5e7eb;
    border: none;
    border-radius: 10px;
    cursor: default;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .pairing .connect-button.ready {
    color: #fff;
    background: #0091ff;
    cursor: pointer;
  }
  .pairing .connect-button.busy {
    opacity: 0.6;
    cursor: default;
  }
  .pairing .error {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    font-size: 14px;
    border-radius: 10px;
    background: rgba(255, 99, 0, 0.12);
    color: #d33c19;
  }
  @media (prefers-color-scheme: dark) {
    .pairing .intro { color: #9ca3af; }
    .pairing input {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.16);
    }
    .pairing .connect-button {
      color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.1);
    }
    .pairing .connect-button.ready {
      color: #fff;
      background: #0091ff;
    }
    .pairing .error { color: #ff8a5c; }
  }
</style>

<div class="pairing">
  <p class="intro" data-i18n="pair.intro_eWind"></p>
  <div class="field">
    <label for="address" data-i18n="pair.address">IP address</label>
    <input type="text" id="address" placeholder="192.168.1.100" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  </div>
  <div class="field">
    <label for="port" data-i18n="pair.port">Port</label>
    <input type="number" id="port" placeholder="502" value="502" min="1" max="65535" inputmode="numeric" required>
  </div>
  <button type="button" id="connect" class="connect-button" data-i18n="pair.connect" disabled>Connect</button>
  <p id="error" class="error" role="alert" aria-live="assertive"></p>
</div>


<script type="text/javascript">
  // Modelled on the pre-4.6.0 pairing page that provably worked in Homey's
  // pairing webview: jQuery's $(function(){}) for binding, the global __()
  // translation helper and Homey.addDevice() with a callback. Each of them
  // falls back to the SDK3-documented equivalent when missing, and script
  // errors are surfaced in the error box instead of failing silently.
  // Before adding, the driver tests the connection; when that fails the
  // message is shown and the button adds the device anyway on the next tap.
  var forceAdd = false;
  // The address and port the failed test was for; changing either tests again.
  var testedFor = null;

  function t(key) {
    try { if (typeof __ === 'function') return __(key); } catch (e) {}
    try { if (typeof Homey !== 'undefined' && typeof Homey.__ === 'function') return Homey.__(key); } catch (e) {}
    return key;
  }

  function showError(msg) {
    var box = document.getElementById('error');
    if (!box) return;
    box.textContent = msg;
    box.style.display = 'block';
  }

  function hideError() {
    var box = document.getElementById('error');
    if (box) box.style.display = 'none';
  }

  window.onerror = function (msg, src, line) {
    try { showError(t('pair.scriptError') + ' ' + msg + (line ? ' (' + line + ')' : '')); } catch (e) {}
  };

  // The same check as lib/settings.ts: an IPv4 address without leading zeros, or a host name.
  function isValidHost(value) {
    if (/^[\d.]+$/.test(value)) {
      var octets = value.split('.');
      return octets.length === 4 && octets.every(function (octet) {
        return /^(0|[1-9]\d{0,2})$/.test(octet) && Number(octet) <= 255;
      });
    }
    return /^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$/.test(value);
  }

  function setButton(label) {
    var button = document.getElementById('connect');
    if (button) button.textContent = label;
  }

  function updateButtonState() {
    var button = document.getElementById('connect');
    var address = document.getElementById('address');
    var port = document.getElementById('port');
    if (!button || !address || !port || button.classList.contains('busy')) return;
    var ready = address.value.trim() !== '' && port.value !== '';
    button.classList.toggle('ready', ready);
    button.disabled = !ready;
  }

  function currentInput() {
    var address = document.getElementById('address');
    var port = document.getElementById('port');
    return (address ? address.value.trim() : '') + ':' + (port ? port.value : '');
  }

  function onInputChanged() {
    if (forceAdd && currentInput() !== testedFor) {
      forceAdd = false;
      setButton(t('pair.connect'));
      hideError();
    }
    updateButtonState();
  }

  function newDeviceId() {
    try {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    } catch (e) {}
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // Homey.emit answers with a promise on newer Homeys and a callback on older ones.
  function testConnection(data, done) {
    var finished = false;
    function finish(error, result) {
      if (finished) return;
      finished = true;
      done(error, result);
    }
    try {
      if (typeof Homey.emit !== 'function') {
        finish(new Error('emit missing'));
        return;
      }
      var answer = Homey.emit('test', data, function (error, result) { finish(error, result); });
      if (answer && typeof answer.then === 'function') {
        answer.then(function (result) { finish(null, result); }, function (error) { finish(error); });
      }
    } catch (e) {
      finish(e);
    }
    setTimeout(function () { finish(new Error('no answer')); }, 12000);
  }

  function addDevice(address, port) {
    var button = document.getElementById('connect');
    button.textContent = t('pair.connecting');

    function onFail(error) {
      button.classList.remove('busy');
      setButton(t('pair.connect'));
      forceAdd = false;
      updateButtonState();
      showError((error && error.message) || String(error));
    }

    var payload = {
      name: 'eWind',
      data: { id: newDeviceId() },
      settings: { address: address, port: port },
    };
    try {
      if (typeof Homey.addDevice === 'function') {
        Homey.addDevice(payload, function (error) {
          if (error) onFail(error);
          else Homey.done();
        });
      } else {
        Homey.createDevice(payload).then(function () { Homey.done(); }).catch(onFail);
      }
    } catch (e) {
      onFail(e);
    }
  }

  function connect() {
    var button = document.getElementById('connect');
    if (!button || button.classList.contains('busy')) return;
    var address = document.getElementById('address').value.trim();
    var portValue = document.getElementById('port').value;
    var port = Number(portValue);

    hideError();

    if (!address || !portValue) {
      showError(t('pair.nosettings'));
      return;
    }
    if (!isValidHost(address) || !Number.isInteger(port) || port < 1 || port > 65535) {
      showError(t('pair.invalidip'));
      return;
    }

    button.disabled = true;
    button.classList.add('busy');

    if (forceAdd) {
      addDevice(address, port);
      return;
    }

    button.textContent = t('pair.testing');
    testConnection({ address: address, port: port }, function (error, result) {
      // Without an answer (an older Homey, or the driver did not reply) the
      // device is added as before, and it connects on its own later.
      if (error || !result || result.ok) {
        addDevice(address, port);
        return;
      }
      button.classList.remove('busy');
      forceAdd = true;
      testedFor = currentInput();
      setButton(t('pair.addAnyway'));
      updateButtonState();
      showError(result.message + ' ' + t('pair.autoConnect'));
    });
  }

  function initPairing() {
    updateButtonState();
    var address = document.getElementById('address');
    if (address) address.focus();
  }

  if (typeof $ === 'function') {
    $(function () {
      $('#connect').on('click', connect);
      $('#address, #port').on('input keyup change', onInputChanged);
      $('#address, #port').on('keydown', function (event) {
        if (event.key === 'Enter') connect();
      });
      initPairing();
    });
  } else {
    if (!window.__exventPairingBound) {
      window.__exventPairingBound = true;
      document.addEventListener('input', function (event) {
        var id = event.target && event.target.id;
        if (id === 'address' || id === 'port') onInputChanged();
      }, true);
      document.addEventListener('keyup', function (event) {
        var id = event.target && event.target.id;
        if (event.key === 'Enter' && (id === 'address' || id === 'port')) connect();
      }, true);
      document.addEventListener('click', function (event) {
        var target = event.target;
        while (target && target !== document) {
          if (target.id === 'connect') { connect(); return; }
          target = target.parentNode;
        }
      }, true);
    }
    (function waitForMarkup() {
      if (!document.getElementById('connect')) {
        setTimeout(waitForMarkup, 50);
        return;
      }
      initPairing();
    })();
  }

  try { Homey.setTitle(t('pair.title_eWind')); } catch (e) {}
</script>
